name: Deploy katabarwalabs.dev

# Every push to main builds the site and publishes it to the S3 bucket behind
# the CloudFront distribution that serves https://katabarwalabs.dev, then
# invalidates the cache. Auth is GitHub OIDC -> IAM role (no stored keys).
# Infra changes (the CloudFormation stack, certificate, DNS) still run through
# aws/deploy.sh from a workstation; this workflow only ships content.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::520829456724:role/katabarwalabs-site-deploy
  BUCKET: katabarwalabs-site-520829456724
  DISTRIBUTION_ID: E3AZBNPWGP4PH1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://katabarwalabs.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap lastmod comes from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (root base)
        run: npm run build
        env:
          SITE_BASE: /

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync dist/ to S3
        run: aws s3 sync dist/ "s3://$BUCKET/" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text

      - name: Smoke test
        run: |
          sleep 20
          curl -sSf -o /dev/null -w 'home %{http_code}\n' https://katabarwalabs.dev/
          curl -sSf https://katabarwalabs.dev/sitemap.xml | grep -c '<loc>'

      # Tell search engines what changed: IndexNow (Bing and friends, key file in
      # public/) and Google Search Console (sitemap resubmit + URL inspection of
      # the changed pages). Google auth is keyless: GitHub OIDC -> GCP workload
      # identity pool "github" in project katabarwa-marketplace -> service
      # account gsc-ci, which is a user on the sc-domain:katabarwalabs.dev
      # property. See tools/seo-notify.py.
      - name: Google credentials (workload identity, no keys)
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/988890029470/locations/global/workloadIdentityPools/github/providers/katabarwalabs-site
          service_account: gsc-ci@katabarwa-marketplace.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters

      - name: Notify search engines
        if: success()
        env:
          SITE: https://katabarwalabs.dev
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GSC_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python3 tools/seo-notify.py
